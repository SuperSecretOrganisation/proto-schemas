syntax = "proto3";

package proto.ping.v1;

option go_package = "github.com/supersecretorganisation/proto-schemas/v3/gen/go/proto/ping/v1;pingpb";

service PingService {
    rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {
    string message = 1;
}
message PingResponse {
    string message = 1;
}

