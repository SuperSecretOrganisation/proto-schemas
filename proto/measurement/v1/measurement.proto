syntax="proto3";

package proto.measurement.v1;

option go_package = "github.com/supersecretorganisation/proto-schemas/v3/gen/go/proto/measurement/v1;measurementpb";

import "google/protobuf/timestamp.proto";

message Measurement {
  int32 id = 1;
  string user_id = 2;
  uint32 toe_pressure = 3;
  uint32 heel_pressure = 4;
  string activity_type = 5;
  string activity_id = 6;
  uint32 weight = 7;
  google.protobuf.Timestamp time_stamp = 8;
}

// Deprecated: single timestamp for N samples loses per-sample timing and the
// per-sample weight array is a modeling error. Use UploadMeasurementSession
// with AggregateWindow instead. Kept for backward compatibility; removal is a
// later major-version cleanup.
message MeasurementBatch {
  option deprecated = true;

  string user_id = 1 [deprecated = true]; // Deprecated: the server derives the caller from the access token; do not set.
  string activity_id = 2;
  string activity_type = 3;
  repeated uint32 heel_pressure = 4;
  repeated uint32 toe_pressure = 5;
  repeated uint32 weight = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message MeasurementFilter {
  string activity_type = 1;
  string activity_id = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  bool average = 5;
  string interval = 6;
  uint32 page_size = 7;
  uint32 page = 8;
  bool ascending = 9;
}

// Session-based upload payloads (aggregate-first transport).

// A single aggregation window: avg/min/max per sensor over window_ms, plus the
// real number of samples folded in. window_start uses sample timestamps, not
// wall-clock ticks, so it survives BLE drops and out-of-order delivery.
message AggregateWindow {
  google.protobuf.Timestamp window_start = 1;
  uint32 window_ms = 2; // Client states the window it computed (10000 default).
  uint32 heel_avg = 3;
  uint32 heel_min = 4;
  uint32 heel_max = 5;
  uint32 toe_avg = 6;
  uint32 toe_min = 7;
  uint32 toe_max = 8;
  uint32 sample_count = 9; // Real samples folded in; < rate*window on BLE drops.
}

// An optional raw sample series for a session segment, sent only for
// cohort-flagged users. samples_gz is gzip(packed little-endian uint16 heel,toe
// pairs); timing is reconstructed from start_time + sample_rate_hz.
message RawSegment {
  google.protobuf.Timestamp start_time = 1;
  uint32 sample_rate_hz = 2; // 50 today; firmware-versioned tomorrow.
  bytes samples_gz = 3;
}

// Session upload: aggregate windows are always present; raw segments are empty
// unless the user is in a raw-capture cohort.
message UploadMeasurementSessionRequest {
  string idempotency_key = 1; // Existing server-side enforcement covers replays.
  string activity_id = 2;
  string activity_type = 3;
  repeated AggregateWindow windows = 4;
  repeated RawSegment raw_segments = 5;
}
message UploadMeasurementSessionResponse {
  bool success = 1;
  uint32 windows_accepted = 2;
}

service MeasurementService {
  rpc GetMeasurement (GetMeasurementRequest) returns (GetMeasurementResponse);
  rpc ListMeasurementsForUser (ListMeasurementsForUserRequest) returns (ListMeasurementsForUserResponse);
  rpc ListAllMeasurements (ListAllMeasurementsRequest) returns (ListAllMeasurementsResponse);
  // Deprecated: use UploadMeasurementSession. Kept functional for now.
  rpc CreateMeasurement (CreateMeasurementRequest) returns (CreateMeasurementResponse) {
    option deprecated = true;
  }
  rpc UploadMeasurementSession (UploadMeasurementSessionRequest) returns (UploadMeasurementSessionResponse);
  rpc UpdateMeasurement (UpdateMeasurementRequest) returns (UpdateMeasurementResponse);
  rpc DeleteMeasurement (DeleteMeasurementRequest) returns (DeleteMeasurementResponse);
}

// Measurement retrieval request and response

// Get a single measurement by ID
message GetMeasurementRequest {
  int32 id = 1;
}
message GetMeasurementResponse {
  Measurement measurement = 1;
}

// List measurements for a specific user
message ListMeasurementsForUserRequest {
  string user_id = 1;
  MeasurementFilter filter = 2;
}
message ListMeasurementsForUserResponse {
  repeated Measurement measurements = 1;
}

// List all measurements with pagination and sorting
message ListAllMeasurementsRequest {
  MeasurementFilter filter = 1;
}
message ListAllMeasurementsResponse {
  repeated Measurement measurements = 1;
}

// Measurement creation and update request and response
message CreateMeasurementRequest {
  string idempotency_key = 2;
  MeasurementBatch measurement_batch = 1;
}
message CreateMeasurementResponse {
  bool success = 1;
}

// Update an existing measurement
message UpdateMeasurementRequest {
  Measurement measurement = 1;
}
message UpdateMeasurementResponse {
  Measurement measurement = 1;
}

// Measurement deletion request and response
message DeleteMeasurementRequest {
  int32 id = 1;
}
message DeleteMeasurementResponse {
  bool success = 1;
}