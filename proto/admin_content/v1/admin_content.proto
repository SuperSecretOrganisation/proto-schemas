syntax = "proto3";

package proto.admin_content.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/supersecretorganisation/proto-schemas/v3/gen/go/proto/admin_content/v1;admincontentpb";

// AdminContentService provides CRUD operations for app content edited by the IOP.
service AdminContentService {
  rpc ListBulkMessages(ListBulkMessagesRequest) returns (ListBulkMessagesResponse);
  rpc SendBulkMessage(SendBulkMessageRequest) returns (SendBulkMessageResponse);
  rpc ListFaqItems(ListFaqItemsRequest) returns (ListFaqItemsResponse);
  rpc UpsertFaqItem(UpsertFaqItemRequest) returns (UpsertFaqItemResponse);
  rpc DeleteFaqItem(DeleteFaqItemRequest) returns (DeleteFaqItemResponse);
  rpc ListFeatureFlags(ListFeatureFlagsRequest) returns (ListFeatureFlagsResponse);
  rpc SetFeatureFlag(SetFeatureFlagRequest) returns (SetFeatureFlagResponse);
  rpc ListTranslations(ListTranslationsRequest) returns (ListTranslationsResponse);
  rpc UpsertTranslation(UpsertTranslationRequest) returns (UpsertTranslationResponse);
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_DRAFT = 1;
  MESSAGE_STATUS_SCHEDULED = 2;
  MESSAGE_STATUS_SENT = 3;
  MESSAGE_STATUS_FAILED = 4;
}

message BulkMessage {
  string id = 1;
  string subject = 2;
  string body = 3;
  int32 recipient_count = 4;
  MessageStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp sent_at = 7;
}

message FaqItem {
  string id = 1;
  string question = 2;
  string answer = 3;
  string category = 4;
  int32 sort_order = 5;
  bool is_published = 6;
}

message FeatureFlag {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_enabled = 4;
  string category = 5;
  google.protobuf.Timestamp last_modified = 6;
}

message TranslationEntry {
  string key = 1;
  map<string, string> values = 2;
  google.protobuf.Timestamp last_modified = 3;
}

message ListBulkMessagesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListBulkMessagesResponse {
  repeated BulkMessage items = 1;
  int32 total_count = 2;
}

message SendBulkMessageRequest {
  string subject = 1;
  string body = 2;
}

message SendBulkMessageResponse {
  BulkMessage message = 1;
}

message ListFaqItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListFaqItemsResponse {
  repeated FaqItem items = 1;
  int32 total_count = 2;
}

message UpsertFaqItemRequest {
  FaqItem item = 1;
}

message UpsertFaqItemResponse {
  FaqItem item = 1;
}

message DeleteFaqItemRequest {
  string id = 1;
}

message DeleteFaqItemResponse {
  string id = 1;
}

message ListFeatureFlagsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListFeatureFlagsResponse {
  repeated FeatureFlag items = 1;
  int32 total_count = 2;
}

message SetFeatureFlagRequest {
  string id = 1;
  bool is_enabled = 2;
}

message SetFeatureFlagResponse {
  FeatureFlag flag = 1;
}

message ListTranslationsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListTranslationsResponse {
  repeated TranslationEntry items = 1;
  int32 total_count = 2;
}

message UpsertTranslationRequest {
  string key = 1;
  map<string, string> values = 2;
}

message UpsertTranslationResponse {
  TranslationEntry entry = 1;
}
