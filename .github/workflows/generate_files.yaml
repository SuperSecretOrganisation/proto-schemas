name: Generate Proto Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history needed for buf breaking and tagging

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}

      # VERSION file is the single source of truth for all version references
      - name: Verify VERSION and pubspec.yaml are in sync
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::VERSION ($VERSION) and pubspec.yaml ($PUBSPEC_VERSION) are out of sync"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Buf lint
        run: buf lint

      # Catch unintentional breaking changes on PRs by comparing against main
      - name: Buf breaking (PR check)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'

      - name: Buf generate
        run: buf generate

      - name: Buf push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: buf push

      - name: Commit generated files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gen/ lib/
          git diff --staged --quiet || git commit -m "chore: auto-generate proto files [skip ci]"
          git push

      # Tag based on VERSION file instead of parsing commit messages.
      # Only creates tags — never overwrites existing ones.
      - name: Create version tag from VERSION file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION_TAG="v${VERSION}"
          echo "Checking for tag: $VERSION_TAG"

          git pull origin main

          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists — skipping"
          else
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG"
            echo "Created and pushed tag: $VERSION_TAG"
          fi
